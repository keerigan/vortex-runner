name: Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    env:
      GODOT_VERSION: '4.7.2'
      APK_PATH: build/android/vortex-runner.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
             "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          godot --version

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" "${APK_PATH}"
          test -f "${APK_PATH}"
          ls -lh "${APK_PATH}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-runner-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${APK_PATH}#Vortex Runner ${GITHUB_REF_NAME} APK" \
            --title "Vortex Runner ${GITHUB_REF_NAME}" \
            --generate-notes
