name: Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    env:
      GODOT_VERSION: '4.7.2'
      APK_PATH: build/android/vortex-runner.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
             "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          godot --version

      - name: Validate Godot project
        run: |
          set +e
          godot --headless --verbose --path . --editor --quit > godot-validation.log 2>&1
          STATUS=$?
          cat godot-validation.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-validation.log; then
            echo "Godot script validation failed"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "Godot validation command failed with status $STATUS"
            exit "$STATUS"
          fi

      - name: Build Android APK
        run: |
          mkdir -p build/android
          set +e
          godot --headless --verbose --path . --export-debug "Android" "${APK_PATH}" > godot-export.log 2>&1
          STATUS=$?
          cat godot-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-export.log; then
            echo "APK rejected: Godot reported script errors"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "Godot export failed with status $STATUS"
            exit "$STATUS"
          fi
          test -f "${APK_PATH}"
          ls -lh "${APK_PATH}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-runner-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish latest development release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Vortex Runner - Latest
          body: Dernier APK construit automatiquement depuis la branche main.
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
